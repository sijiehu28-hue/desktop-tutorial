<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f1c">
<title>贪吃蛇 · Snake</title>
<style>
  :root{
    --bg1:#070b14; --bg2:#0d1426;
    --panel:rgba(255,255,255,.06);
    --line:rgba(255,255,255,.12);
    --text:#e8eeff; --muted:#93a0c4;
    --accent:#2ee6a8; --accent2:#5b7cff; --danger:#ff5c7a;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(900px 600px at 15% -10%, rgba(91,124,255,.22), transparent 60%),
      radial-gradient(800px 500px at 100% 0%, rgba(46,230,168,.16), transparent 55%),
      linear-gradient(160deg,var(--bg1),var(--bg2));
    display:flex; align-items:center; justify-content:center;
    min-height:100dvh; padding:16px;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  .app{width:min(520px,100%)}
  header{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
  h1{font-size:22px;margin:0;letter-spacing:.5px}
  .sub{color:var(--muted);font-size:12px}
  .hud{display:flex;gap:10px;margin-bottom:10px}
  .chip{
    flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:8px 12px;display:flex;justify-content:space-between;align-items:center
  }
  .chip .label{color:var(--muted);font-size:12px}
  .chip .val{font-weight:700;font-variant-numeric:tabular-nums;font-size:18px}
  .stage{
    position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);
    box-shadow:0 20px 50px rgba(0,0,0,.45), inset 0 0 60px rgba(91,124,255,.06);
    background:#0a0f1c;
  }
  canvas{display:block;width:100%;height:auto;aspect-ratio:1/1;touch-action:none}
  .overlay{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(6,10,22,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  .overlay[hidden]{display:none}
  .panel{
    text-align:center;padding:22px 26px;border-radius:16px;
    background:rgba(13,20,38,.92);border:1px solid var(--line);
    box-shadow:0 24px 60px rgba(0,0,0,.5);max-width:86%;
  }
  .panel h2{margin:0 0 6px;font-size:20px}
  .panel p{margin:0 0 14px;color:var(--muted);font-size:13px;line-height:1.6}
  button{
    font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);
    border-radius:11px;padding:9px 14px;cursor:pointer;transition:.15s
  }
  button:hover{border-color:var(--accent);background:rgba(46,230,168,.1)}
  button:active{transform:translateY(1px)}
  button.primary{
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:0;color:#04121a;font-weight:700;padding:10px 22px
  }
  button.primary:hover{filter:brightness(1.08)}
  .toolbar{display:flex;gap:10px;margin-top:12px}
  .toolbar button{flex:1}
  .hint{color:var(--muted);font-size:12px;margin-top:10px;text-align:center;line-height:1.7}
  .dpad{
    display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,48px);
    gap:8px;justify-content:center;margin-top:14px
  }
  .dpad button{display:flex;align-items:center;justify-content:center;font-size:18px;padding:0;touch-action:none}
  .dpad .up{grid-column:2;grid-row:1}
  .dpad .left{grid-column:1;grid-row:2}
  .dpad .down{grid-column:2;grid-row:2}
  .dpad .right{grid-column:3;grid-row:2}
  @media (max-width:420px){
    .dpad{grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,54px)}
    h1{font-size:19px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🐍 贪吃蛇</h1>
    <div class="sub">方向键 / WASD 控制</div>
  </header>

  <div class="hud">
    <div class="chip"><span class="label">得分</span><span class="val" id="score">0</span></div>
    <div class="chip"><span class="label">最高</span><span class="val" id="best">0</span></div>
  </div>

  <div class="stage">
    <canvas id="game" width="480" height="480"></canvas>
    <div class="overlay" id="overlay">
      <div class="panel">
        <h2 id="ovTitle">贪吃蛇</h2>
        <p id="ovText">方向键 / WASD 移动 · 空格暂停</p>
        <button class="primary" id="ovBtn">开始游戏</button>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <button id="btnPause">暂停</button>
    <button id="btnRestart">重新开始</button>
  </div>

  <div class="hint">吃到一个食物 +10 分，速度会逐渐加快 · 手机可用方向键或滑动屏幕</div>

  <div class="dpad">
    <button class="up" data-dir="up">▲</button>
    <button class="left" data-dir="left">◀</button>
    <button class="down" data-dir="down">▼</button>
    <button class="right" data-dir="right">▶</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var COLS = 20, ROWS = 20, CELL = 24;
  var W = COLS * CELL, H = ROWS * CELL;

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.scale(dpr, dpr);

  var elScore = document.getElementById('score');
  var elBest = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ovTitle');
  var ovText = document.getElementById('ovText');
  var ovBtn = document.getElementById('ovBtn');
  var btnPause = document.getElementById('btnPause');
  var btnRestart = document.getElementById('btnRestart');

  var BEST_KEY = 'web_snake_best_v1';
  var best = 0;
  try { best = parseInt(window.localStorage.getItem(BEST_KEY) || '0', 10) || 0; } catch (e) { best = 0; }
  if (!isFinite(best) || best < 0) best = 0;

  var snake, dir, queue, food, score, state, tickMs, acc, lastTime;

  /* ---------- 状态 ---------- */

  function init() {
    snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
    dir = { x: 1, y: 0 };
    queue = [];
    score = 0;
    tickMs = 150;
    acc = 0;
    lastTime = 0;
    state = 'ready';
    food = null;
    placeFood();
    updateHud();
    updatePauseBtn();
    showOverlay('ready');
    draw();
  }

  function placeFood() {
    var free = [];
    for (var y = 0; y < ROWS; y++) {
      for (var x = 0; x < COLS; x++) {
        var occupied = false;
        for (var i = 0; i < snake.length; i++) {
          if (snake[i].x === x && snake[i].y === y) { occupied = true; break; }
        }
        if (!occupied) free.push({ x: x, y: y });
      }
    }
    food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
  }

  function start() {
    if (state === 'ready' || state === 'paused') {
      state = 'playing';
      lastTime = 0;
      acc = 0;
      queue = [];
      overlay.hidden = true;
      updatePauseBtn();
    }
  }

  function togglePause() {
    if (state === 'playing') {
      state = 'paused';
      showOverlay('paused');
      updatePauseBtn();
    } else if (state === 'paused') {
      start();
    }
  }

  function restart() {
    init();
    start();
  }

  function gameOver() {
    state = 'over';
    showOverlay('over');
    updatePauseBtn();
  }

  function win() {
    state = 'win';
    showOverlay('win');
    updatePauseBtn();
  }

  /* ---------- 一帧的逻辑 ---------- */

  function step() {
    if (queue.length) dir = queue.shift();

    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      gameOver();
      return;
    }

    var eating = food && head.x === food.x && head.y === food.y;
    var body = eating ? snake : snake.slice(0, -1);
    for (var i = 0; i < body.length; i++) {
      if (body[i].x === head.x && body[i].y === head.y) {
        gameOver();
        return;
      }
    }

    snake.unshift(head);

    if (eating) {
      score += 10;
      if (score > best) {
        best = score;
        try { window.localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
      }
      updateHud();
      if (tickMs > 70) tickMs = Math.max(70, tickMs - 3);
      placeFood();
      if (!food) { win(); return; }
    } else {
      snake.pop();
    }
  }

  function turn(nx, ny) {
    var cur = queue.length ? queue[queue.length - 1] : dir;
    if ((nx === cur.x && ny === cur.y) || (nx === -cur.x && ny === -cur.y)) return;
    if (queue.length >= 2) return;
    queue.push({ x: nx, y: ny });
  }

  /* ---------- 渲染 ---------- */

  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function mixColor(a, b, t) {
    t = Math.max(0, Math.min(1, t));
    return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * t) + ',' +
                    Math.round(a[1] + (b[1] - a[1]) * t) + ',' +
                    Math.round(a[2] + (b[2] - a[2]) * t) + ')';
  }

  function draw() {
    ctx.fillStyle = '#0a0f1c';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = 'rgba(255,255,255,0.022)';
    for (var y = 0; y < ROWS; y++) {
      for (var x = 0; x < COLS; x++) {
        if ((x + y) & 1) ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
      }
    }

    if (food) {
      var fx = food.x * CELL + CELL / 2;
      var fy = food.y * CELL + CELL / 2;
      var pulse = 1 + 0.06 * Math.sin(performance.now() / 260);
      ctx.save();
      ctx.shadowColor = 'rgba(255,92,122,.85)';
      ctx.shadowBlur = 18;
      ctx.fillStyle = '#ff5c7a';
      ctx.beginPath();
      ctx.arc(fx, fy, CELL * 0.3 * pulse, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    for (var i = snake.length - 1; i >= 0; i--) {
      var s = snake[i];
      var t = snake.length > 1 ? i / (snake.length - 1) : 0;
      ctx.fillStyle = mixColor([46, 230, 168], [91, 124, 255], t);
      roundRect(s.x * CELL + 2, s.y * CELL + 2, CELL - 4, CELL - 4, 6);
      ctx.fill();
    }

    if (snake.length) {
      var h = snake[0];
      var hx = h.x * CELL + CELL / 2;
      var hy = h.y * CELL + CELL / 2;
      var px = -dir.y, py = dir.x;
      var off = CELL * 0.17, er = CELL * 0.075;
      ctx.fillStyle = '#04121a';
      for (var sgn = -1; sgn <= 1; sgn += 2) {
        ctx.beginPath();
        ctx.arc(hx + dir.x * CELL * 0.1 + px * off * sgn,
                hy + dir.y * CELL * 0.1 + py * off * sgn,
                er, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  /* ---------- 界面 ---------- */

  function updateHud() {
    elScore.textContent = String(score);
    elBest.textContent = String(Math.max(best, score));
  }

  function updatePauseBtn() {
    if (state === 'playing') {
      btnPause.textContent = '暂停';
      btnPause.disabled = false;
    } else if (state === 'paused') {
      btnPause.textContent = '继续';
      btnPause.disabled = false;
    } else {
      btnPause.textContent = '暂停';
      btnPause.disabled = true;
    }
  }

  function showOverlay(kind) {
    overlay.hidden = false;
    if (kind === 'ready') {
      ovTitle.textContent = '贪吃蛇';
      ovText.textContent = '方向键 / WASD 移动 · 空格暂停';
      ovBtn.textContent = '开始游戏';
    } else if (kind === 'paused') {
      ovTitle.textContent = '已暂停';
      ovText.textContent = '按空格或点下面的按钮继续';
      ovBtn.textContent = '继续';
    } else if (kind === 'over') {
      ovTitle.textContent = '游戏结束';
      ovText.textContent = '本局得分 ' + score + ' · 最高 ' + best;
      ovBtn.textContent = '再来一局';
    } else if (kind === 'win') {
      ovTitle.textContent = '🎉 通关啦！';
      ovText.textContent = '整个棋盘都吃满了，得分 ' + score;
      ovBtn.textContent = '再玩一次';
    }
  }

  /* ---------- 主循环 ---------- */

  function loop(t) {
    requestAnimationFrame(loop);
    if (state !== 'playing') return;

    if (!lastTime) lastTime = t;
    var dt = t - lastTime;
    lastTime = t;
    if (dt > 250) dt = 250;          // 切回标签页时避免时间暴涨
    acc += dt;

    var guard = 0;
    while (acc >= tickMs && state === 'playing' && guard++ < 4) {
      acc -= tickMs;
      step();
    }
    draw();
  }

  /* ---------- 输入 ---------- */

  var keyDir = {
    ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
    w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0]
  };

  document.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k.length === 1) k = k.toLowerCase();

    if (keyDir[k]) {
      e.preventDefault();
      if (state === 'ready' || state === 'paused') start();
      if (state === 'playing') turn(keyDir[k][0], keyDir[k][1]);
      return;
    }

    if (k === ' ' || k === 'Spacebar' || k === 'Space') {
      e.preventDefault();
      if (state === 'ready') start();
      else if (state === 'playing' || state === 'paused') togglePause();
      else restart();
      return;
    }

    if (k === 'r') {
      e.preventDefault();
      restart();
    }
  });

  ovBtn.addEventListener('click', function () {
    if (state === 'ready' || state === 'paused') start();
    else restart();
  });

  btnPause.addEventListener('click', togglePause);
  btnRestart.addEventListener('click', restart);

  var padMap = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  var pads = document.querySelectorAll('.dpad button');
  Array.prototype.forEach.call(pads, function (b) {
    b.addEventListener('click', function () {
      var d = padMap[b.getAttribute('data-dir')];
      if (!d) return;
      if (state === 'ready' || state === 'paused') start();
      if (state === 'playing') turn(d[0], d[1]);
    });
  });

  var touch = null;
  canvas.addEventListener('pointerdown', function (e) {
    touch = { x: e.clientX, y: e.clientY };
  });
  canvas.addEventListener('pointerup', function (e) {
    if (!touch) return;
    var dx = e.clientX - touch.x;
    var dy = e.clientY - touch.y;
    touch = null;
    if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
    if (state === 'ready' || state === 'paused') start();
    if (state !== 'playing') return;
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0);
    else turn(0, dy > 0 ? 1 : -1);
  });
  canvas.addEventListener('pointercancel', function () { touch = null; });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden && state === 'playing') togglePause();
  });

  /* ---------- 调试钩子（方便在控制台里玩/测试） ---------- */
  window.__snake = {
    init: init,
    start: start,
    step: step,
    turn: turn,
    get state() { return state; },
    get score() { return score; },
    get snake() { return snake.map(function (s) { return { x: s.x, y: s.y }; }); },
    get food() { return food ? { x: food.x, y: food.y } : null; },
    setFood: function (x, y) { food = { x: x, y: y }; },
    setDir: function (x, y) { dir = { x: x, y: y }; queue = []; },
    setState: function (s) { state = s; },
    get tickMs() { return tickMs; }
  };

  /* ---------- 启动 ---------- */
  init();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
